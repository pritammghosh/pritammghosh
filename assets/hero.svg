  <g fill="#a5f3fc" opacity=".7"><circle cx="82" cy="56" r="2"/><circle cx="110" cy="78" r="1.5"/><circle cx="1090" cy="220" r="2"/><circle cx="1040" cy="55" r="1.5"/><circle cx="930" cy="42" r="2"/></g>
