    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#22d3ee"/><stop offset=".52" stop-color="#818cf8"/><stop offset="1" stop-color="#2dd4bf"/>
